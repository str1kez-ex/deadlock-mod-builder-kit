[package]
name = "deadlock-mod-kit"
version = "0.1.4"
description = "Deadlock Mod Build Kit — Launcher & Tool Manager"
authors = ["you"]
edition = "2021"

[lib]
name = "deadlock_mod_kit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "deadlock-mod-kit"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"

tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

zip = "2"
tar = "0.4"
flate2 = "1"
xz2 = "0.1"

anyhow = "1"
log = "0.4"
dirs = "6"
steamlocate = "2"
sevenz-rust = "0.6.1"

[profile.release]
panic = "abort"
codegen-units = 1
opt-level = "s"
lto = true
strip = true
